name: "publish"

on:
  push:
    tags:
      - 'v*' # Trigger only when a version tag is pushed (e.g., v1.0.0)
  workflow_dispatch: # Allow manual trigger from the GitHub Actions tab

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm install

      - name: read changelog
        id: changelog
        shell: bash
        run: |
          echo "content<<ENDOFCHANGELOG" >> $GITHUB_OUTPUT
          cat CHANGELOG.md | tr -d '\r' >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "ENDOFCHANGELOG" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: endlesslist-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "EndlessList v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.content }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
